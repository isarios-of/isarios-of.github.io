<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isabela</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,system-ui,sans-serif; background:#111; color:#f5f5f5; }
  main { width:min(360px,92vw); text-align:center; }
  h1 { font-size:1.4rem; font-weight:600; margin:0 0 .25rem; }
  p { opacity:.7; margin:0 0 1.25rem; font-size:.95rem; line-height:1.35; }
  a, button { display:block; width:100%; margin:.55rem 0; padding:.95rem 1rem; border-radius:14px;
    text-decoration:none; font-weight:600; font-size:1.05rem; border:0; cursor:pointer;
    font-family:inherit; box-sizing:border-box; }
  .a { background:#fff; color:#111; }
  .b { background:#2a2a2a; color:#fff; }
  .hint { opacity:.55; margin:1.1rem 0 .35rem; font-size:.8rem; }
  code { display:block; padding:.7rem; border-radius:10px; background:#1a1a1a;
    font-size:.85rem; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Isabela</h1>
  <p>lo que no sale en tiktok</p>
  <button class="a" type="button" id="ig">abrir insta para más 🔥🍑</button>
  <button class="b" type="button" id="yt">abrir yt para más 🔥🍑</button>
  <p class="hint">enlace manual</p>
  <code id="copy">fanvue.com/isarios</code>
</main>
<script>
(function () {
  var IG_HTTPS = "https://www.instagram.com/isabelaa.rios/";
  var IG_APP = "instagram://user?username=isabelaa.rios";
  var YT_HTTPS = "https://www.youtube.com/@isabelaarios";
  var YT_APP = "youtube://www.youtube.com/@isabelaarios";
  var YT_AND = "intent://www.youtube.com/@isabelaarios#Intent;scheme=https;package=com.google.android.youtube;end";
  var FV = "https://www.fanvue.com/isarios";
  var ua = navigator.userAgent || "";
  var and = /android/i.test(ua);
  document.getElementById("ig").onclick = function () {
    location.href = IG_APP;
    setTimeout(function () { location.href = IG_HTTPS; }, 900);
  };
  document.getElementById("yt").onclick = function () {
    location.href = and ? YT_AND : YT_APP;
    setTimeout(function () { location.href = YT_HTTPS; }, 900);
  };
  document.getElementById("copy").onclick = function () {
    if (navigator.clipboard) navigator.clipboard.writeText(FV);
  };
})();
</script>
</body>
</html>
