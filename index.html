<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isabela</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,system-ui,sans-serif; background:#111; color:#f5f5f5; }
  main { width:min(360px,92vw); text-align:center; }
  h1 { font-size:1.4rem; font-weight:600; margin:0 0 .25rem; }
  p { opacity:.7; margin:0 0 1.25rem; font-size:.95rem; line-height:1.35; }
  a, button { display:block; width:100%; margin:.55rem 0; padding:.95rem 1rem; border-radius:14px;
    text-decoration:none; font-weight:600; font-size:1.05rem; border:0; cursor:pointer;
    font-family:inherit; box-sizing:border-box; }
  .a { background:#fff; color:#111; }
  .b { background:#2a2a2a; color:#fff; }
  .hint { opacity:.55; margin:1.1rem 0 .35rem; font-size:.8rem; }
  code { display:block; padding:.7rem; border-radius:10px; background:#1a1a1a;
    font-size:.85rem; word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>Isabela</h1>
  <p>lo que no sale en tiktok</p>
  <button class="a" type="button" id="ig">abrir insta para más 🔥🍑</button>
  <p class="hint">enlace manual</p>
  <code id="copy">fanvue.com/isarios</code>
</main>
<script>
(function () {
  // Instagram highlight shared by Juan (2026-09-27). Android opens it inside the Instagram app through an intent
  // (falls back to the web link if the app is missing); iOS follows the https link, which Instagram handles itself.
  var IG_HTTPS = "https://www.instagram.com/s/aGlnaGxpZ2h0OjE3OTcwNDg5NDU5MTc5ODg1?story_media_id=4007296125354303749&vrfl=a3cydTM1MjhnaG13";
  var IG_AND = "intent://www.instagram.com/s/aGlnaGxpZ2h0OjE3OTcwNDg5NDU5MTc5ODg1?story_media_id=4007296125354303749&vrfl=a3cydTM1MjhnaG13#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=https%3A%2F%2Fwww.instagram.com%2Fs%2FaGlnaGxpZ2h0OjE3OTcwNDg5NDU5MTc5ODg1%3Fstory_media_id%3D4007296125354303749%26vrfl%3Da3cydTM1MjhnaG13;end";
  // Fanvue tracking link fv-2 ("tiktok-dm"): clicks, follows and subscriptions from TikTok DMs (sales audit 2026-10-14).
  var FV = "https://www.fanvue.com/isarios/fv-2";
  var ua = navigator.userAgent || "";
  var and = /android/i.test(ua);
  document.getElementById("ig").onclick = function () {
    location.href = and ? IG_AND : IG_HTTPS;
  };
  document.getElementById("copy").onclick = function () {
    if (navigator.clipboard) navigator.clipboard.writeText(FV);
  };
})();
</script>
</body>
</html>
